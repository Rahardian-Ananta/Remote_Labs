version: "3.9"

networks:
  remotelab_net:
    driver: bridge

volumes:
  scheduler_data:
  exec1_data:
  exec2_data:
  exec3_data:

services:
  # ------------------------------------------------------------------
  # Executor 1 — first ring node (bootstrap anchor)
  # ------------------------------------------------------------------
  executor1:
    build:
      context: .
      dockerfile: Dockerfile.executor
    image: remotelab/executor:latest
    container_name: remotelab_executor1
    networks:
      - remotelab_net
    ports:
      - "9001:9001"
    volumes:
      - exec1_data:/app/data
    environment:
      EXECUTOR_ID: "exec1"
      EXECUTOR_HOST: "executor1"
      EXECUTOR_PORT: "9001"
      EXECUTOR_CAPACITY: "4"
      MAX_RANKS: "4"
      EXECUTOR_DB_PATH: "/app/data/exec1.db"
      BOOTSTRAP_NODES: "http://executor1:9001,http://executor2:9002,http://executor3:9003"
      CHORD_MAINTENANCE_SEC: "5.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/health"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Executor 2
  # ------------------------------------------------------------------
  executor2:
    build:
      context: .
      dockerfile: Dockerfile.executor
    image: remotelab/executor:latest
    container_name: remotelab_executor2
    networks:
      - remotelab_net
    ports:
      - "9002:9002"
    volumes:
      - exec2_data:/app/data
    environment:
      EXECUTOR_ID: "exec2"
      EXECUTOR_HOST: "executor2"
      EXECUTOR_PORT: "9002"
      EXECUTOR_CAPACITY: "4"
      MAX_RANKS: "4"
      EXECUTOR_DB_PATH: "/app/data/exec2.db"
      BOOTSTRAP_NODES: "http://executor1:9001,http://executor2:9002,http://executor3:9003"
      CHORD_MAINTENANCE_SEC: "5.0"
    depends_on:
      executor1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002/health"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Executor 3
  # ------------------------------------------------------------------
  executor3:
    build:
      context: .
      dockerfile: Dockerfile.executor
    image: remotelab/executor:latest
    container_name: remotelab_executor3
    networks:
      - remotelab_net
    ports:
      - "9003:9003"
    volumes:
      - exec3_data:/app/data
    environment:
      EXECUTOR_ID: "exec3"
      EXECUTOR_HOST: "executor3"
      EXECUTOR_PORT: "9003"
      EXECUTOR_CAPACITY: "4"
      MAX_RANKS: "4"
      EXECUTOR_DB_PATH: "/app/data/exec3.db"
      BOOTSTRAP_NODES: "http://executor1:9001,http://executor2:9002,http://executor3:9003"
      CHORD_MAINTENANCE_SEC: "5.0"
    depends_on:
      executor1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9003/health"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Scheduler — coordinates all executor nodes
  # ------------------------------------------------------------------
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    image: remotelab/scheduler:latest
    container_name: remotelab_scheduler
    networks:
      - remotelab_net
    ports:
      - "8000:8000"
    volumes:
      - scheduler_data:/app/data
    environment:
      SCHEDULER_HOST: "0.0.0.0"
      SCHEDULER_PORT: "8000"
      EXECUTORS: "exec1=http://executor1:9001,exec2=http://executor2:9002,exec3=http://executor3:9003"
      DB_PATH: "/app/data/scheduler.db"
      HEALTH_INTERVAL_SEC: "5.0"
      CACHE_CAPACITY: "500"
      CACHE_LEASE_SEC: "60.0"
    depends_on:
      executor1:
        condition: service_healthy
      executor2:
        condition: service_healthy
      executor3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped

